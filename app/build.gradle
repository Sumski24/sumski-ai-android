plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sumski.ai'
    compileSdk 35

    defaultConfig {
        applicationId "com.sumski.ai"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
    }
}
